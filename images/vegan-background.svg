<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f5e4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Define clipping paths for rounded corners -->
    <clipPath id="roundedRect">
      <rect width="120" height="80" rx="10" ry="10"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Left Side Vegan Images -->
  <g opacity="0.85">
    <!-- Top Left -->
    <g transform="translate(30,50)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background1.jpg" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Second Left -->
    <g transform="translate(30,160)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background2.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Third Left -->
    <g transform="translate(30,270)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background3.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Bottom Left -->
    <g transform="translate(30,380)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background4.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Right Side Vegan Images -->
  <g opacity="0.85">
    <!-- Top Right -->
    <g transform="translate(1050,50)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background5.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Second Right -->
    <g transform="translate(1050,160)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background6.jpg" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Third Right -->
    <g transform="translate(1050,270)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background7.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
    
    <!-- Bottom Right -->
    <g transform="translate(1050,380)">
      <rect width="120" height="80" rx="10" ry="10" fill="white" stroke="#4CAF50" stroke-width="2" opacity="0.9"/>
      <image href="vegan_background8.png" x="5" y="5" width="110" height="70" clip-path="url(#roundedRect)" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Text Overlay Area (lighter) -->
  <ellipse cx="600" cy="300" rx="400" ry="150" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="600" cy="300" rx="350" ry="120" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Decorative Elements -->
  <g opacity="0.3">
    <!-- Small scattered vegetable icons -->
    <g transform="translate(200,100)">
      <circle cx="10" cy="10" r="5" fill="#4CAF50"/>
      <circle cx="8" cy="8" r="3" fill="#66BB6A"/>
    </g>
    <g transform="translate(900,400)">
      <circle cx="10" cy="10" r="5" fill="#FF9800"/>
      <polygon points="5,15 10,5 15,15" fill="#FF9800"/>
    </g>
    <g transform="translate(300,450)">
      <circle cx="8" cy="8" r="6" fill="#F44336"/>
    </g>
    <g transform="translate(800,150)">
      <ellipse cx="10" cy="12" rx="6" ry="8" fill="#FFEB3B"/>
    </g>
  </g>
</svg>