<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f5e4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8f0;stop-opacity:1" />
    </linearGradient>
    <pattern id="veggiePattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Broccoli -->
      <g transform="translate(20,20)">
        <circle cx="15" cy="15" r="8" fill="#4CAF50" opacity="0.3"/>
        <circle cx="10" cy="10" r="5" fill="#66BB6A" opacity="0.4"/>
        <circle cx="20" cy="12" r="4" fill="#81C784" opacity="0.3"/>
        <rect x="14" y="20" width="2" height="8" fill="#8BC34A" opacity="0.4"/>
      </g>
      <!-- Carrot -->
      <g transform="translate(150,50)">
        <polygon points="10,25 15,5 20,25" fill="#FF9800" opacity="0.3"/>
        <path d="M15,5 Q12,2 10,0 Q15,1 20,0 Q18,2 15,5" fill="#4CAF50" opacity="0.4"/>
      </g>
      <!-- Tomato -->
      <g transform="translate(80,120)">
        <circle cx="15" cy="15" r="10" fill="#F44336" opacity="0.3"/>
        <path d="M10,8 Q15,5 20,8 Q18,10 15,9 Q12,10 10,8" fill="#4CAF50" opacity="0.4"/>
      </g>
      <!-- Bell Pepper -->
      <g transform="translate(40,150)">
        <ellipse cx="15" cy="18" rx="8" ry="12" fill="#FFEB3B" opacity="0.3"/>
        <rect x="13" y="8" width="4" height="4" fill="#4CAF50" opacity="0.4"/>
      </g>
      <!-- Lettuce Leaf -->
      <g transform="translate(120,30)">
        <path d="M10,20 Q5,15 8,10 Q15,8 20,12 Q22,18 15,22 Q10,20 10,20" fill="#8BC34A" opacity="0.3"/>
      </g>
      <!-- Peas -->
      <g transform="translate(170,140)">
        <ellipse cx="15" cy="15" rx="12" ry="6" fill="#4CAF50" opacity="0.3"/>
        <circle cx="10" cy="15" r="3" fill="#66BB6A" opacity="0.4"/>
        <circle cx="15" cy="15" r="3" fill="#66BB6A" opacity="0.4"/>
        <circle cx="20" cy="15" r="3" fill="#66BB6A" opacity="0.4"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Vegetable Pattern Overlay -->
  <rect width="100%" height="100%" fill="url(#veggiePattern)" opacity="0.6"/>
  
  <!-- Large Decorative Vegetables Around Text Area -->
  <g opacity="0.6">
    <!-- Left Side Vegetables -->
    <g transform="translate(50,150) scale(4)">
      <!-- Large Broccoli -->
      <circle cx="15" cy="15" r="12" fill="#4CAF50" opacity="0.7"/>
      <circle cx="10" cy="10" r="8" fill="#66BB6A" opacity="0.8"/>
      <circle cx="20" cy="12" r="6" fill="#81C784" opacity="0.7"/>
      <circle cx="18" cy="18" r="5" fill="#A5D6A7" opacity="0.6"/>
      <rect x="14" y="25" width="3" height="12" fill="#8BC34A" opacity="0.8"/>
    </g>
    
    <!-- Right Side Vegetables -->
    <g transform="translate(1000,100) scale(3.5)">
      <!-- Large Carrot -->
      <polygon points="15,35 25,10 35,35" fill="#FF9800" opacity="0.8"/>
      <path d="M25,10 Q20,5 15,0 Q25,2 35,0 Q30,5 25,10" fill="#4CAF50" opacity="0.8"/>
      <line x1="20" y1="15" x2="30" y2="15" stroke="#FF6F00" stroke-width="1" opacity="0.6"/>
      <line x1="18" y1="20" x2="32" y2="20" stroke="#FF6F00" stroke-width="1" opacity="0.6"/>
      <line x1="20" y1="25" x2="30" y2="25" stroke="#FF6F00" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Bottom Left Vegetables -->
    <g transform="translate(80,400) scale(3)">
      <!-- Large Tomato -->
      <circle cx="20" cy="20" r="18" fill="#F44336" opacity="0.7"/>
      <path d="M8,12 Q20,8 32,12 Q28,16 20,14 Q12,16 8,12" fill="#4CAF50" opacity="0.8"/>
      <ellipse cx="20" cy="20" rx="12" ry="15" fill="#E53935" opacity="0.3"/>
    </g>
    
    <!-- Bottom Right Vegetables -->
    <g transform="translate(950,450) scale(3.2)">
      <!-- Large Bell Pepper -->
      <ellipse cx="20" cy="25" rx="12" ry="18" fill="#FFEB3B" opacity="0.8"/>
      <rect x="17" y="12" width="6" height="6" fill="#4CAF50" opacity="0.8"/>
      <ellipse cx="20" cy="25" rx="8" ry="12" fill="#FFF176" opacity="0.4"/>
    </g>
    
    <!-- Top Right Corner -->
    <g transform="translate(900,50) scale(2.8)">
      <!-- Large Lettuce -->
      <path d="M15,30 Q8,22 12,15 Q22,12 32,18 Q35,28 25,35 Q15,30 15,30" fill="#8BC34A" opacity="0.8"/>
      <path d="M18,25 Q12,20 15,15 Q25,13 30,20 Q28,25 22,28 Q18,25 18,25" fill="#AED581" opacity="0.6"/>
    </g>
    
    <!-- Top Left Corner -->
    <g transform="translate(150,80) scale(2.5)">
      <!-- Large Peas Pod -->
      <ellipse cx="25" cy="20" rx="18" ry="8" fill="#4CAF50" opacity="0.8"/>
      <circle cx="15" cy="20" r="4" fill="#66BB6A" opacity="0.9"/>
      <circle cx="25" cy="20" r="4" fill="#66BB6A" opacity="0.9"/>
      <circle cx="35" cy="20" r="4" fill="#66BB6A" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Text Overlay Area (lighter) -->
  <ellipse cx="600" cy="300" rx="400" ry="150" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="600" cy="300" rx="350" ry="120" fill="rgba(255,255,255,0.2)"/>
</svg>