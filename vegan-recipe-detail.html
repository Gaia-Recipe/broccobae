<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Detail - Vegan Recipe Collection</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🌱 Vegan Recipe Collection</h1>
            <a href="vegan-recipes-index.html" class="nav-link">← Back to Home</a>
        </div>
    </header>

    <main class="container">
        <a href="#" id="back-button" class="back-button">← Back to Category</a>
        
        <div class="recipe-detail">
            <img id="recipe-image" src="" alt="Recipe Image">
            
            <div class="recipe-content">
                <h1 id="recipe-title" class="recipe-title">Loading Recipe...</h1>
                
                <div class="recipe-section">
                    <h3>🥘 Ingredients</h3>
                    <ul id="ingredients-list" class="ingredients-list">
                        <li>Loading ingredients...</li>
                    </ul>
                </div>
                
                <div class="recipe-section">
                    <h3>👩‍🍳 Instructions</h3>
                    <ol id="instructions-list" class="instructions-list">
                        <li>Loading instructions...</li>
                    </ol>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Vegan Recipe Collection. All recipes are 100% plant-based.</p>
        </div>
    </footer>

    <script src="assets/recipes.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
